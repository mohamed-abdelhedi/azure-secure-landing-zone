name: Security & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform / ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [environments/dev, environments/prod, modules/network-hub]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2
        with:
          version: 1.20.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
        working-directory: ${{ matrix.directory }}
      - run: terraform validate
        working-directory: ${{ matrix.directory }}
      - run: node scripts/test-plans.mjs '${{ matrix.directory }}'

  policies:
    name: Policy regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf7abe97250bbb1f332b5 # v2
        with:
          version: 1.20.2
      - run: opa check --strict policies/
      - run: opa test policies/ -v
      - run: node --test tests/policy-cli.test.mjs

  security:
    name: Blocking IaC scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install checkov==3.3.16
      - run: checkov -d . --framework terraform --compact
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          version: v0.74.0
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
